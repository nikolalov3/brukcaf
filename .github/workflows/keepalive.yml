# Keep-alive Supabase — jeden malutki odczyt co ~5 dni, żeby darmowy
# projekt nie usnął (Supabase pauzuje po 7 dniach bez aktywności).
# To tylko GET z publicznym kluczem anon (tym samym, co na stronie),
# więc żadnych sekretów tu nie ma i nic wrażliwego nie wycieka.
name: keepalive-supabase

on:
  schedule:
    - cron: '0 6 */5 * *'   # 06:00 UTC co 5. dzień miesiąca (maks. przerwa < 7 dni)
  workflow_dispatch:          # można też odpalić ręcznie z zakładki Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Puknij do bazy (select 1 wiersz)
        run: |
          URL="https://xkgkbluvuasrwjmqvrwd.supabase.co"
          # publiczny klucz anon (jawny, ten sam co w /api/config na stronie)
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrZ2tibHV2dWFzcndqbXF2cndkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTYzNzAsImV4cCI6MjEwMjI3MjM3MH0.4Z0oOYdNP4tw7xeaYG_s0Mg0QAw6CPl0XLbOoMcVB60"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "$URL/rest/v1/coffees?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          # 200 = baza żyje. Inny kod = coś nie tak, niech workflow padnie (dostaniesz maila z GitHuba).
          test "$code" = "200"
